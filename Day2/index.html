<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Infinite Marquee</title>
  </head>

  <body>
    <main>
      <section class="marquee-section">

        <div class="marquee marquee-top">
          <div class="marquee-track">
            <div class="marquee-text">
              DESIGN
              <span>✦</span>
              DEVELOPMENT
              <span>✦</span>
              ANIMATION
              <span>✦</span>
              CREATIVE
              <span>✦</span>
            </div>
          </div>
        </div>

        <div class="marquee marquee-bottom">
          <div class="marquee-track">
            <div class="marquee-text">
              JAVASCRIPT
              <span>✦</span>
              GSAP
              <span>✦</span>
              FRONTEND
              <span>✦</span>
              VITE
              <span>✦</span>
            </div>
          </div>
        </div>

      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
